<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy New Year 🎉</title>
  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg,#0f172a,#001219);
      color:#fff;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      -webkit-font-smoothing:antialiased;
      text-align:center;
      padding:24px;
      overflow:hidden;
    }
    .card{
      max-width:900px;
    }
    h1{font-size:clamp(28px,6vw,68px);margin:0 0 8px}
    p{margin:0 0 20px;color:rgba(255,255,255,0.85)}
    .hint{font-size:14px;opacity:0.9}
    a.heart{color:#ff3b81;text-decoration:none}
    /* ensure the canvas we add doesn't block pointer events */
    canvas.confetti-canvas{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999}
  </style>
</head>
<body>
  <div class="card">
    <h1>Happy New Year 🎆</h1>
    <p>To someone special — click or tap anywhere and enjoy a little confetti surprise. <span style="display:inline-block;margin-left:6px">❤️</span></p>
    <p class="hint">Tap, click, or press anywhere on the screen.</p>
  </div>

  <script src="confetti.js"></script>
  <script>
    // Hook UI interactions to the confetti script
    (function(){
      // Prevent double-firing on touch devices: ignore click events that happen shortly after touchstart
      let lastTouchTime = 0;

      function handlePointer(x, y){
        if(typeof spawnConfetti === 'function') spawnConfetti(x, y);
      }

      document.addEventListener('touchstart', function(ev){
        lastTouchTime = Date.now();
        const t = ev.touches && ev.touches[0];
        if(t){
          handlePointer(t.clientX, t.clientY);
        }
      }, {passive:true});

      document.addEventListener('click', function(ev){
        // ignore click if it closely follows a touch (prevents duplicate)
        if(Date.now() - lastTouchTime < 600) return;
        handlePointer(ev.clientX, ev.clientY);
      });

      // Also support keyboard triggering for accessibility (center of viewport)
      document.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){
          const cx = window.innerWidth/2;
          const cy = window.innerHeight/2;
          handlePointer(cx, cy);
        }
      });
    })();
  </script>
</body>
</html>
